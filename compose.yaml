services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      FRONTEND_DIR: /app/static
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      FREE_RESPONSE_ENABLED: ${FREE_RESPONSE_ENABLED:-false}
      PICTURE_DESCRIPTION_ENABLED: ${PICTURE_DESCRIPTION_ENABLED:-false}
      OPENAI_VISION_ENABLED: ${OPENAI_VISION_ENABLED:-false}
      FREE_RESPONSE_DAILY_REQUEST_LIMIT: ${FREE_RESPONSE_DAILY_REQUEST_LIMIT:-100}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}
      TRANSCRIPTION_DAILY_SECONDS_LIMIT: ${TRANSCRIPTION_DAILY_SECONDS_LIMIT:-1800}
      BUDGET_TIMEZONE: ${BUDGET_TIMEZONE:-Europe/Vilnius}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      IMAGE_DAILY_REQUEST_LIMIT: ${IMAGE_DAILY_REQUEST_LIMIT:-10}
      IMAGE_BUDGET_TIMEZONE: ${IMAGE_BUDGET_TIMEZONE:-Europe/Vilnius}
      YOUTUBE_PROVIDER: ${YOUTUBE_PROVIDER:-downsub}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - learning-data:/data
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  learning-data:
